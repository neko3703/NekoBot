<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message Received - Neko Code</title>
<meta name="description" content="Thanks for contacting Neko Code. Your message has been received and we will get back to you shortly.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0912">
<link rel="icon" href="./images/neko-code.png">
<script>try{if(localStorage.getItem("theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Same palette as the home page. Dark theme (default): midnight plum + sakura. */
  --bg:#0b0912; --panel:#110e1a; --panel2:#181426; --card:#1a1628;
  --heading:#ffd3e4; --text:#f1ecf6; --soft:#c9c6cf; --muted:#a59db8; --line:#2e2742;
  --accent:#f4a3c4; --accent-hi:#ffd3e4; --accent-deep:#c2577f;
  --on-accent:#1a0a12;
  --header-bg:rgba(11,9,18,.88); --footer-bg:#07050c;
  --rainbow:#f4a3c4,#b9a4ff,#9ee6ff,#b9a4ff,#ffd3e4,#f4a3c4,#c2577f,#f4a3c4;
  --shadow-card:0 8px 16px rgba(0,0,0,.3);
  color-scheme:dark;
  --head:"Montserrat",sans-serif; --body:"Inter",sans-serif;
}
[data-theme="light"]{
  --bg:#fbf7fb; --panel:#ffffff; --panel2:#f5eef6; --card:#ffffff;
  --heading:#a82459; --text:#241a2e; --soft:#4a3f5a; --muted:#6b5f7c; --line:#e3d7ea;
  --accent:#c93874; --accent-hi:#d63f7d; --accent-deep:#a82459;
  --on-accent:#ffffff;
  --header-bg:rgba(251,247,251,.9); --footer-bg:#efe6f1;
  --rainbow:#d63f7d,#7c4dff,#0ea5c6,#7c4dff,#e0568c,#d63f7d,#a82459,#d63f7d;
  --shadow-card:0 8px 18px rgba(70,30,90,.12);
  color-scheme:light;
}
@property --angle{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes spin{to{--angle:360deg}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes ring{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.7);opacity:0}}
@keyframes fall{0%{transform:translateY(-40px) rotate(0);opacity:0}10%{opacity:.9}100%{transform:translateY(calc(100vh + 40px)) rotate(720deg);opacity:0}}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:400 1rem/1.6 var(--body);-webkit-font-smoothing:antialiased;transition:background-color .3s,color .3s}
a{color:inherit;text-decoration:none}
h1{font-family:var(--head)}
:focus-visible{outline:3px solid var(--accent-hi);outline-offset:3px;border-radius:6px}
.container{max-width:1152px;margin:0 auto;padding:0 1rem}

/* Header (same as home page) */
header{position:sticky;top:0;z-index:30;background:var(--header-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:.6rem;height:50px}
.brand{display:flex;align-items:center;gap:.5rem;font:800 1.15rem var(--head);color:var(--accent-hi);margin-right:auto}
.brand img{width:26px;height:26px;border-radius:50%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 1.6rem;border-radius:.6rem;font:600 1rem var(--body);color:var(--on-accent);border:2px solid transparent;background:linear-gradient(135deg,var(--accent-deep),var(--accent-hi) 55%,var(--accent));box-shadow:0 4px 8px rgba(0,0,0,.3);transition:transform .15s,box-shadow .25s,filter .25s,background .25s;cursor:pointer}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1);box-shadow:0 8px 18px rgba(244,163,196,.35)}
.btn.outline{background:transparent;border-color:var(--accent);color:var(--accent-hi);box-shadow:none}
.btn.outline:hover{background:rgba(244,163,196,.15);color:var(--text);filter:none}
.btn.head-cta{height:32px;padding:0 .95rem;font-size:.82rem;line-height:1;border-width:1px;border-radius:.45rem;box-shadow:none}
.btn.head-cta:hover{transform:none;box-shadow:0 4px 12px rgba(244,163,196,.3)}
.theme-btn{width:32px;height:32px;display:grid;place-items:center;background:none;border:1px solid var(--line);color:var(--soft);border-radius:.45rem;cursor:pointer;transition:border-color .2s,color .2s}
.theme-btn:hover{border-color:var(--accent);color:var(--text)}
.theme-btn svg{width:17px;height:17px}
.theme-btn .sun{display:none}
[data-theme="light"] .theme-btn .sun{display:block}[data-theme="light"] .theme-btn .moon{display:none}

/* Page */
main{flex:1;display:grid;place-items:center;padding:3rem 1rem;position:relative;overflow:hidden;background:radial-gradient(55% 45% at 50% 30%,rgba(244,163,196,.14),transparent 70%)}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:0;display:block;opacity:0;animation:fall linear infinite}
.card{position:relative;z-index:1;max-width:36rem;width:100%;text-align:center;padding:3rem 2rem;background-image:linear-gradient(var(--card),var(--card)),conic-gradient(from var(--angle),var(--rainbow));background-origin:border-box;background-clip:padding-box,border-box;border:2px solid transparent;border-radius:1.5rem;box-shadow:var(--shadow-card);animation:spin 15s linear infinite,rise .7s both}
.check{position:relative;width:88px;height:88px;margin:0 auto 1.5rem;display:grid;place-items:center;border-radius:50%;background:rgba(244,163,196,.15);color:var(--accent-hi);animation:pop .8s .1s both}
.check::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:ring 2.4s ease-out infinite}
.check svg{width:46px;height:46px}
h1{font-size:clamp(2.2rem,6vw,3.2rem);font-weight:800;line-height:1.1;margin-bottom:1rem}
h1 span{background:linear-gradient(90deg,#f4a3c4,#ffd3e4 45%,#b9a4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-theme="light"] h1 span{background-image:linear-gradient(90deg,#c93874,#e0568c 45%,#7c4dff);-webkit-background-clip:text;background-clip:text}
.card p{color:var(--soft);font-size:1.1rem;margin-bottom:2rem}
.cta{display:flex;gap:.9rem;justify-content:center;flex-wrap:wrap}
footer{background:var(--footer-bg);color:var(--muted);padding:1.25rem 0;font-size:.9rem;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}
</style>
</head>
<body>
<header>
  <div class="container nav">
    <a class="brand" href="/"><img src="./images/neko-code.png" alt="">Neko Code</a>
    <button class="theme-btn" id="theme" aria-label="Switch to light mode"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <a class="btn head-cta" href="https://nekocode.in/invite" target="_blank" rel="noopener">Invite</a>
  </div>
</header>

<main>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <div class="card">
    <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div>
    <h1><span>Message Received!</span></h1>
    <p>Your message has been successfully received. We appreciate you reaching out and will get back to you shortly!</p>
    <div class="cta">
      <a class="btn" href="/">Go to Homepage</a>
      <a class="btn outline" href="https://nekocode.in/discord" target="_blank" rel="noopener">Join our Discord</a>
    </div>
  </div>
</main>

<footer><div class="container">&copy; 2025 Neko Code. All rights reserved.</div></footer>

<script>
const $=s=>document.querySelector(s);
/* Dark / light mode (shared with the other pages) */
(()=>{
  const root=document.documentElement,btn=$("#theme"),meta=document.querySelector('meta[name="theme-color"]');
  const apply=t=>{
    if(t==="light")root.dataset.theme="light";else delete root.dataset.theme;
    btn.setAttribute("aria-label",t==="light"?"Switch to dark mode":"Switch to light mode");
    meta.content=t==="light"?"#fbf7fb":"#0b0912";
  };
  apply(root.dataset.theme==="light"?"light":"dark");
  btn.onclick=()=>{const t=root.dataset.theme==="light"?"dark":"light";apply(t);try{localStorage.setItem("theme",t)}catch(e){}};
})();
/* Confetti in the site colors */
(()=>{
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const box=$("#confetti"),colors=["#f4a3c4","#b9a4ff","#9ee6ff","#ffd3e4","#c2577f","#7c4dff"],r=Math.random;
  for(let i=0;i<60;i++){
    const c=document.createElement("i"),s=7+r()*6,tri=r()<.33;
    c.style.cssText=`left:${r()*100}%;animation-duration:${6+r()*6}s;animation-delay:${r()*6}s;`+
      (tri?`width:0;height:0;border-left:${s/2}px solid transparent;border-right:${s/2}px solid transparent;border-bottom:${s*1.6}px solid ${colors[i%6]}`
          :`width:${s}px;height:${s}px;background:${colors[i%6]};border-radius:${r()<.5?"50%":"2px"}`);
    box.appendChild(c);
  }
})();
</script>
</body>
</html>
